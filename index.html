<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c6b5b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">

<title>كاشير الماركت</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#f1f4f3; --surface:#ffffff; --surface2:#e8eeec; --ink:#13201e; --muted:#5a6a67; --line:#d5dfdc;
  --accent:#0c6b5b; --accent-ink:#ffffff; --promo:#d99a14; --bad:#bf3a2b; --ok:#1d8548;
  --font:'Cairo',Tahoma,'Segoe UI',sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1514; --surface:#152120; --surface2:#1d2d2b; --ink:#e7f0ee; --muted:#9bb0ac; --line:#2a3d3a;
  --accent:#2fb59c; --accent-ink:#06201b; --promo:#e8b032; --bad:#ef6b5c; --ok:#4cc27c; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=checkbox]{width:auto}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
#app{max-width:1320px;margin:0 auto;padding-block:12px 40px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0}
.brand{font-weight:800;font-size:20px;flex:1;min-width:120px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;background:var(--surface2);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}
.chip.off{background:color-mix(in srgb,var(--bad) 15%,var(--surface));color:var(--bad)}
.chip.warn{background:color-mix(in srgb,var(--promo) 22%,var(--surface));color:var(--ink)}
.nav{display:flex;gap:2px;overflow-x:auto;border-bottom:2px solid var(--line);margin-bottom:14px}
.nav button{background:none;border:0;padding:10px 13px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
.nav button.act{color:var(--accent);border-color:var(--accent)}
.nav .bd{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;margin-inline-start:4px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 16px;font-weight:700;text-decoration:none;display:inline-block;text-align:center}
.btn.sec{background:var(--surface2);color:var(--ink)}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.lg{padding:13px 20px;font-size:17px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px}
h2{margin:0 0 10px;font-size:18px} h3{margin:14px 0 6px;font-size:15px}
.sale{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;align-items:start}
@media(max-width:900px){.sale{grid-template-columns:minmax(0,1fr)}}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:10px 0}
.cats button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;white-space:nowrap;font-weight:600}
.cats button.act{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:10px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;position:relative;display:flex;flex-direction:column;gap:3px}
.pc:hover:not(:disabled){border-color:var(--accent)}
.pc:disabled{opacity:.5}
.pc .im{height:70px;display:grid;place-items:center;font-size:42px;border-radius:8px;background:var(--surface2);overflow:hidden}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc b{font-size:14px;line-height:1.3}
.pc .pr{color:var(--accent);font-weight:800}
.tag{position:absolute;top:6px;inset-inline-start:6px;background:var(--promo);color:#201500;font-size:11px;font-weight:800;border-radius:6px;padding:0 6px}
.tag.low{background:var(--bad);color:#fff;inset-inline-start:auto;inset-inline-end:6px}
.cart{position:sticky;top:8px}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:center}
.qty{display:inline-flex;align-items:center;gap:5px}
.qty button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface2);font-weight:800}
.qi{width:64px;padding:3px 5px;text-align:center}
.pe{width:84px;padding:3px 6px;direction:ltr;text-align:center}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .g{font-size:22px;font-weight:800;border-top:2px solid var(--ink);margin-top:6px;padding-top:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:76px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 6px;font-weight:600}
.seg button.act{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.scroll{overflow-x:auto}
.thumb{width:38px;height:38px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-size:22px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi span{display:block;color:var(--muted);font-size:13px}
.kpi b{font-size:21px}
.bar{display:grid;grid-template-columns:130px 1fr 60px;gap:8px;align-items:center;margin:6px 0}
.bar i{display:block;height:12px;background:var(--accent);border-radius:6px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:14px;max-width:580px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form label{display:grid;gap:3px;font-size:13px;font-weight:600;color:var(--muted)}
.form .full{grid-column:1/-1}
@media(max-width:480px){.form{grid-template-columns:1fr}}
.rc{white-space:pre-wrap;direction:rtl;background:var(--surface2);border-radius:8px;padding:12px;font-size:13px;line-height:1.7}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:80;font-weight:600;max-width:90vw}
.alert{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border:1px solid var(--bad);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:14px}
.alert.w{background:color-mix(in srgb,var(--promo) 16%,var(--surface));border-color:var(--promo)}
.login{max-width:420px;margin:8vh auto 0}
.ubtn{display:flex;justify-content:space-between;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px;font-weight:700}
.ubtn.act{border-color:var(--accent);background:var(--surface2)}
.neg{color:var(--bad)} .pos{color:var(--ok)}
.sec-t{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 8px}
#printbox{display:none}
@media print{
  @page{size:80mm auto;margin:3mm}
  body.printing>*:not(#printbox){display:none!important}
  body.printing{background:#fff!important;color:#000!important;padding:0!important}
  body.printing #printbox{display:block;white-space:pre-wrap;direction:rtl;font:13px/1.6 Tahoma,Arial,sans-serif;width:72mm;color:#000}
}
</style></head><body>
<div id="app"></div>
<script>
/* ======================= ثوابت ======================= */
const PERMS={sell:'البيع',discount:'منح الخصم',editPrice:'تعديل السعر',delInvoice:'حذف الفواتير',returns:'المرتجعات',cashmove:'سحب/إيداع نقد',customers:'الزبائن والآجل',products:'المنتجات والمخزن',expenses:'المصاريف',reports:'التقارير',users:'الموظفون',settings:'الإعدادات'};
const ROLES={
  manager:{n:'مدير',p:Object.keys(PERMS)},
  accountant:{n:'محاسب',p:['products','expenses','reports','customers']},
  cashier:{n:'كاشير',p:['sell','discount','cashmove','customers']}};
const PAYS={cash:'نقدي',card:'بطاقة مصرفية',zain:'زين كاش',credit:'آجل (دين)'};
const EXPCATS=['إيجار','رواتب','كهرباء ومولدة','نقل','صيانة','مشتريات تشغيل','أخرى'];
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));
const INC=n=>({'.sv':{increment:n}});
function ph(s){let a=0xdeadbeef,b=0x41c6ce57;s='k4sh'+s;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}
  a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)}
const DEFPINS=['1234','1111','2222','3333','4444'].map(ph);

/* ======================= التخزين والمزامنة ======================= */
const LS='kashier2';
const lsGet=(k,d)=>{try{const v=localStorage.getItem(LS+'-'+k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(LS+'-'+k,JSON.stringify(v))}catch(e){}};
let cfg=lsGet('cfg',{url:'',auth:''}),SRV=lsGet('data',{}),pend=lsGet('out',[]),DB=SRV;
let net=cfg.url?'offline':'local',gotSnap=false,es=null,flushing=false,retryT=null,cacheT=null,dataT=null;
const base=()=>cfg.url.replace(/\/+$/,'')+(cfg.auth?'/'+encodeURIComponent(cfg.auth):'');
const authQ=()=>'';

function getP(T,parts){let o=T;for(const k of parts){if(o==null)return undefined;o=o[k]}return o}
function setP(T,parts,val){
  let o=T;for(let i=0;i<parts.length-1;i++){const k=parts[i];if(o[k]==null||typeof o[k]!=='object')o[k]={};o=o[k]}
  const k=parts[parts.length-1];if(val===null||val===undefined)delete o[k];else o[k]=val}
function applyOp(T,o){
  if(o.p==='')return o.t==='set'?clone(o.v):T;
  const parts=o.p.split('/');
  if(o.t==='del'){setP(T,parts,null);return T}
  if(o.t==='set'){setP(T,parts,clone(o.v));return T}
  for(const k in o.v){const v=o.v[k],pp=[...parts,k];
    if(v&&typeof v==='object'&&v['.sv']&&v['.sv'].increment!==undefined)setP(T,pp,(+getP(T,pp)||0)+v['.sv'].increment);
    else setP(T,pp,v===null?null:clone(v))}
  return T;
}
function recompute(){if(!pend.length){DB=SRV;return}let T=clone(SRV);pend.forEach(o=>{T=applyOp(T,o)});DB=T}
function cacheSoon(){clearTimeout(cacheT);cacheT=setTimeout(()=>{lsSet('data',SRV);lsSet('out',pend)},400)}
function W(op){
  if(!cfg.url){SRV=applyOp(SRV,op);DB=SRV;cacheSoon();return}
  pend.push(op);DB=(DB===SRV)?applyOp(clone(SRV),op):applyOp(DB,op);lsSet('out',pend);updChrome();flush();
}
const set=(p,v)=>W({t:'set',p,v}),upd=(p,o)=>W({t:'upd',p,v:o}),del=p=>W({t:'del',p});

async function send(o){
  const u=base()+'/'+o.p+'.json'+authQ();
  const r=await fetch(u,{method:{set:'PUT',upd:'PATCH',del:'DELETE'}[o.t],headers:{'Content-Type':'application/json'},body:o.t==='del'?undefined:JSON.stringify(o.v)});
  if(!r.ok){const e=new Error('http '+r.status);e.status=r.status;throw e}
}
async function flush(){
  if(flushing||!cfg.url)return;flushing=true;
  try{
    while(pend.length){
      try{await send(pend[0]);pend.shift();lsSet('out',pend)}
      catch(e){
        if(e.status){pend.shift();lsSet('out',pend);toast('رفض الخادم عملية ('+e.status+'). تحقق من قواعد قاعدة البيانات')}
        else{setNet('offline');clearTimeout(retryT);retryT=setTimeout(flush,5000);break}
      }
    }
  }finally{flushing=false;recompute();updChrome();onDataSoon()}
}
function setNet(n){if(net!==n){net=n;updChrome()}}
function connect(){
  disconnect();if(!cfg.url)return;gotSnap=false;
  try{es=new EventSource(base()+'/.json'+authQ())}catch(e){setNet('error');return}
  es.addEventListener('put',e=>onEv(JSON.parse(e.data),false));
  es.addEventListener('patch',e=>onEv(JSON.parse(e.data),true));
  es.onopen=()=>{setNet('online');flush()};
  es.onerror=()=>{setNet(es&&es.readyState===2?'error':'offline')};
  es.addEventListener('auth_revoked',()=>setNet('error'));
  es.addEventListener('cancel',()=>setNet('error'));
}
function disconnect(){if(es){es.close();es=null}}
function hasLocal(){return SRV&&((SRV.products&&Object.keys(SRV.products).length)||(SRV.invoices&&Object.keys(SRV.invoices).length))}
function onEv(ev,isPatch){
  const path=ev.path,data=ev.data;
  if(path==='/'&&!isPatch){
    if(data==null){if(!SRV||!SRV.users)SRV=seedTree();pend.unshift({t:'set',p:'',v:SRV});lsSet('out',pend)}
    else{if(!gotSnap&&hasLocal()&&!getP(data,['products']))lsSet('premerge',SRV);SRV=data}
    gotSnap=true;
  }else if(isPatch){for(const k in data)setP(SRV,(path+'/'+k).split('/').filter(Boolean),data[k])}
  else setP(SRV,path.split('/').filter(Boolean),data);
  setNet('online');recompute();cacheSoon();flush();onDataSoon();
}
function onDataSoon(){clearTimeout(dataT);dataT=setTimeout(onData,300)}
function onData(){
  if(!U){if(!DB.users||$('#waitmsg'))login();return}
  const me=(DB.users||{})[U.id];if(!me)return logout();U=me;updChrome();
  if($('#ov'))return;const a=document.activeElement;if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))return;
  if(tab==='sell')rGrid();else render();
}
function updChrome(){
  const c=$('#netchip');if(!c)return;const n=pend.length;
  const m={local:['محلي (جهاز واحد)',''],online:['متصل'+(n?' — '+n+' بانتظار الإرسال':''),'on'],offline:['غير متصل'+(n?' — '+n+' محفوظة للإرسال':''),'warn'],error:['خطأ في الاتصال','off']}[net];
  c.textContent=m[0];c.className='chip '+m[1];
}

/* ======================= بيانات أولية ======================= */
function seedTree(){
  const mk=(n,code,pin,role)=>{const id=rid();return[id,{id,name:n,code,pinh:ph(pin),role,perms:ROLES[role].p.join(',')}]};
  return{settings:{store:'السوبرماركت',vat:0,cur:'د.ع',owner:'',footer:'شكراً لتسوقكم معنا',expDays:30,allowNeg:false},
    users:Object.fromEntries([mk('المدير','M','1234','manager'),mk('المحاسب','A','4444','accountant'),mk('كاشير 1','K1','1111','cashier'),mk('كاشير 2','K2','2222','cashier'),mk('كاشير 3','K3','3333','cashier')])};
}
function loadSamples(){
  const dt=n=>ymd(new Date(Date.now()+n*864e5));
  [['أرز بسمتي 5 كغم','مواد غذائية','piece',9500,7800,'6281100000011',40,10,'🍚',0,5,9000,''],
   ['سكر 1 كغم','مواد غذائية','piece',1250,950,'6281100000028',60,15,'🧂',0,0,0,''],
   ['زيت طبخ 1.5 لتر','مواد غذائية','piece',4500,3600,'6281100000035',30,10,'🫒',0,0,0,''],
   ['شاي 400 غم','مواد غذائية','piece',3500,2700,'6281100000042',25,8,'☕',10,0,0,''],
   ['معجون طماطم','معلبات','piece',1000,650,'6281100000059',48,12,'🥫',0,12,900,''],
   ['حليب طويل الأجل','ألبان','piece',1500,1100,'6281100000066',24,10,'🥛',0,0,0,dt(20)],
   ['ماء 0.5 لتر','مشروبات','piece',250,120,'6281100000073',120,24,'💧',0,12,200,''],
   ['طماطم','خضار وفواكه','kg',1250,800,'',30,8,'🍅',0,0,0,''],
   ['خيار','خضار وفواكه','kg',1000,600,'',22,8,'🥒',0,0,0,''],
   ['تفاح','خضار وفواكه','kg',2500,1700,'',18,6,'🍎',0,0,0,''],
   ['صابون','تنظيف','piece',750,450,'6281100000080',40,10,'🧼',0,0,0,''],
   ['بسكويت','حلويات','piece',750,450,'6281100000097',6,10,'🍪',0,0,0,dt(200)]
  ].forEach(r=>{const id=rid();set('products/'+id,{id,name:r[0],cat:r[1],unit:r[2],price:r[3],cost:r[4],barcode:r[5],stock:r[6],reorder:r[7],emoji:r[8],img:'',promo:r[9],tierQty:r[10],tierPrice:r[11],exp:r[12]})});
  toast('تم تحميل منتجات تجريبية');render();
}

/* ======================= أدوات ======================= */
const ymd=d=>{d=new Date(d);const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const fmtD=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`};
const S=()=>DB.settings||{store:'كاشير',vat:0,cur:'د.ع',footer:'',expDays:30};
const money=n=>Math.round(n||0).toLocaleString('en-US')+' '+S().cur;
const f0=n=>Math.round(n||0).toLocaleString('en-US');
const qf=n=>(Math.round(n*1000)/1000).toString();
const list=n=>Object.values(DB[n]||{});
const P=id=>(DB.products||{})[id];
const uPrice=(p,q)=>{let pr=p.price;if(p.tierQty&&p.tierPrice&&q>=p.tierQty)pr=Math.min(pr,p.tierPrice);return Math.round(pr*(1-(p.promo||0)/100))};
const lt=c=>Math.round(c.qty*(c.manual!=null?c.manual:uPrice(P(c.id),c.qty)));
const daysTo=s=>s?Math.ceil((new Date(s+'T23:59:59').getTime()-Date.now())/864e5):9999;
let tt;function toast(m){let t=$('.toast');if(t)t.remove();t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);clearTimeout(tt);tt=setTimeout(()=>t.remove(),3000)}
function modal(html){closeModal();const o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML='<div class="modal">'+html+'</div>';o.addEventListener('mousedown',e=>{if(e.target===o)closeModal()});document.body.appendChild(o)}
function closeModal(){stopCam();const o=$('#ov');if(o)o.remove()}
function copy(txt){const f=()=>toast('انسخ النص يدوياً من المربع');try{navigator.clipboard.writeText(txt).then(()=>toast('تم النسخ'),f)}catch(e){f()}}
function receiptImage(t){
  const W=576,P=20,F=26,LH=38,c=document.createElement('canvas'),x=c.getContext('2d');
  const font=F+'px Cairo,Tahoma,Arial,sans-serif';x.font=font;x.direction='rtl';
  const lines=[];
  String(t).split('\n').forEach(l=>{
    if(x.measureText(l).width<=W-2*P){lines.push(l);return}
    let cur='';l.split(' ').forEach(w=>{const n=cur?cur+' '+w:w;if(x.measureText(n).width>W-2*P&&cur){lines.push(cur);cur=w}else cur=n});lines.push(cur);
  });
  c.width=W;c.height=lines.length*LH+2*P;

function openShift(id){
  const v=$('#'+id).value;if(v===''||+v<0)return toast('أدخل مبلغ السيولة الأولية');
  if(myShift())return;const sid=rid();set('shifts/'+sid,{id:sid,userId:U.id,userName:U.name,openAt:Date.now(),opening:+v,closedAt:0});toast('تم فتح الوردية');render();
}
function shiftNums(s){
  const inv=list('invoices').filter(i=>i.shiftId===s.id&&!i.voided),rets=list('returns').filter(r=>r.shiftId===s.id),
    mv=list('moves').filter(m=>m.shiftId===s.id),pays=list('payments').filter(p=>p.shiftId===s.id);
  const by={cash:0,card:0,zain:0,credit:0};let disc=0,vat=0,gross=0,cost=0;
  inv.forEach(i=>{by[i.pay]+=i.total;disc+=i.disc;vat+=i.vat;i.lines.forEach(l=>cost+=l.cost*l.qty);gross+=i.net});
  const retAmt=rets.reduce((a,r)=>a+r.amount,0),cashRef=rets.filter(r=>r.refund==='cash').reduce((a,r)=>a+r.amount,0);
  rets.forEach(r=>{cost-=r.cost;gross-=r.net});
  const mIn=mv.filter(m=>m.type==='in').reduce((a,m)=>a+m.amount,0),mOut=mv.filter(m=>m.type==='out').reduce((a,m)=>a+m.amount,0);
  const payCash=pays.filter(p=>p.method==='cash').reduce((a,p)=>a+p.amount,0);
  return{n:inv.length,total:inv.reduce((a,i)=>a+i.total,0)-retAmt,by,disc,vat,profit:gross-cost,retAmt,cashRef,mIn,mOut,payCash,mv,
    expected:s.opening+by.cash+mIn-mOut+payCash-cashRef};
}

  <div class="card"><h2>إغلاق الوردية</h2><p class="muted small">عدّ النقد الفعلي في الجارور وأدخله، وسيطابقه النظام مع المبيعات والحركات.</p>

   'المرتجعات: '+f0(n.retAmt),'الخصومات: '+f0(n.disc),'الربح الإجمالي: '+f0(n.profit)+' '+c,'--------------------',

/* ======================= التقارير ======================= */
let range='today',rfrom='',rto='';
function rng(){
  const now=Date.now(),d0=new Date();d0.setHours(0,0,0,0);const t0=d0.getTime();
  return{today:[t0,now],yest:[t0-864e5,t0-1],week:[now-7*864e5,now],month:[now-30*864e5,now],all:[0,now+1e9],
    custom:[rfrom?new Date(rfrom+'T00:00:00').getTime():0,rto?new Date(rto+'T23:59:59').getTime():now+1e9]}[range];
}
function stats(t0,t1){
  const inv=list('invoices').filter(i=>!i.voided&&i.ts>=t0&&i.ts<=t1),rets=list('returns').filter(r=>r.ts>=t0&&r.ts<=t1),exps=list('expenses').filter(e=>e.ts>=t0&&e.ts<=t1);
  const by={cash:0,card:0,zain:0,credit:0},top={},cash={};let total=0,net=0,cost=0,vat=0,disc=0;
  inv.forEach(i=>{total+=i.total;net+=i.net;vat+=i.vat;disc+=i.disc;by[i.pay]+=i.total;const c=cash[i.userName]||(cash[i.userName]={n:0,t:0});c.n++;c.t+=i.total;
    i.lines.forEach(l=>{cost+=l.cost*l.qty;top[l.name]=(top[l.name]||0)+l.qty})});
  let retAmt=0;rets.forEach(r=>{retAmt+=r.amount;total-=r.amount;net-=r.net;cost-=r.cost;vat-=r.vat;by[r.pay||'cash']-=r.amount;r.lines.forEach(l=>{top[l.name]=(top[l.name]||0)-l.qty})});
  const expT=exps.reduce((a,e)=>a+e.amount,0);
  return{n:inv.length,total,net,vat,disc,cost,gross:net-cost,exp:expT,profit:net-cost-expT,retAmt,by,cash,top:Object.entries(top).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1])};
}
function vRep(){
  const [t0,t1]=rng(),st=stats(t0,t1),mx=st.top[0]?.[1]||1,c=S().cur,debts=list('customers').reduce((a,x)=>a+(x.balance||0),0);
  const lbl={today:'اليوم',yest:'أمس',week:'آخر 7 أيام',month:'آخر 30 يوماً',all:'الكل',custom:'فترة محددة'}[range];
  const text=[S().store,'تقرير المبيعات — '+lbl,'عدد الفواتير: '+st.n,'صافي المبيعات (بعد المرتجعات): '+f0(st.total)+' '+c,'الربح الإجمالي: '+f0(st.gross)+' '+c,'المصاريف: '+f0(st.exp)+' '+c,'صافي الربح بعد المصاريف: '+f0(st.profit)+' '+c,'ديون الزبائن الحالية: '+f0(debts)+' '+c,'الأكثر مبيعاً:',...st.top.slice(0,5).map((t,i)=>`${i+1}. ${t[0]} (${qf(t[1])})`)].join('\n');
  const open=list('shifts').filter(s=>!s.closedAt),closed=list('shifts').filter(s=>s.closedAt).sort((a,b)=>b.closedAt-a.closedAt).slice(0,8);
  $('#view').innerHTML=`<div class="row" style="margin-bottom:12px"><div class="seg grow">${[['today','اليوم'],['yest','أمس'],['week','7 أيام'],['month','30 يوماً'],['all','الكل'],['custom','محدد']].map(r=>`<button class="${range===r[0]?'act':''}" onclick="range='${r[0]}';vRep()">${r[1]}</button>`).join('')}</div>
  <button class="btn" onclick="printText(${h(JSON.stringify(text))})">طباعة</button><button class="btn sec" onclick="copy(${h(JSON.stringify(text))})">نسخ</button>${S().owner?`<a class="btn" target="_blank" rel="noopener" href="${waLink(S().owner,text)}">إرسال للمالك</a>`:''}</div>
  ${range==='custom'?`<div class="row" style="margin-bottom:12px"><label>من <input type="date" id="rf" value="${rfrom}" onchange="rfrom=this.value;vRep()"></label><label>إلى <input type="date" id="rt" value="${rto}" onchange="rto=this.value;vRep()"></label></div>`:''}
  <div class="kpis"><div class="kpi"><span>صافي المبيعات</span><b class="num">${money(st.total)}</b></div><div class="kpi"><span>عدد الفواتير</span><b class="num">${st.n}</b></div>
  <div class="kpi"><span>تكلفة المواد</span><b class="num">${money(st.cost)}</b></div><div class="kpi"><span>الربح الإجمالي</span><b class="num">${money(st.gross)}</b></div>
  <div class="kpi"><span>المصاريف</span><b class="num">${money(st.exp)}</b></div><div class="kpi"><span>صافي الربح بعد المصاريف</span><b class="num ${st.profit<0?'neg':'pos'}">${money(st.profit)}</b></div>
  <div class="kpi"><span>المرتجعات</span><b class="num">${money(st.retAmt)}</b></div><div class="kpi"><span>الخصومات</span><b class="num">${money(st.disc)}</b></div>
  <div class="kpi"><span>الضريبة</span><b class="num">${money(st.vat)}</b></div><div class="kpi"><span>ديون الزبائن الحالية</span><b class="num ${debts>0?'neg':''}">${money(debts)}</b></div></div>
  <div class="two"><div class="card"><h2>الأكثر مبيعاً</h2>${st.top.slice(0,8).map(t=>`<div class="bar"><span>${h(t[0])}</span><i style="width:${t[1]/mx*100}%"></i><b class="num">${qf(t[1])}</b></div>`).join('')||'<p class="muted">لا مبيعات في هذه الفترة</p>'}</div>
  <div class="card"><h2>طرق الدفع</h2>${Object.entries(st.by).map(([k,v])=>`<div class="row" style="justify-content:space-between;padding:4px 0"><span>${PAYS[k]}</span><b class="num">${money(v)}</b></div>`).join('')}
  <h3>حسب الكاشير</h3>${Object.entries(st.cash).map(([k,v])=>`<div class="row" style="justify-content:space-between;padding:4px 0"><span>${h(k)} <span class="small muted">(${v.n} فاتورة)</span></span><b class="num">${money(v.t)}</b></div>`).join('')||'<p class="muted">—</p>'}</div>
  <div class="card"><h2>الورديات</h2>${open.map(s=>`<div class="row" style="justify-content:space-between;padding:4px 0"><span>${h(s.userName)} <span class="chip on">مفتوحة</span></span><b class="num small">${fmtD(s.openAt)}</b></div>`).join('')}
  ${closed.map(s=>`<div class="row" style="justify-content:space-between;padding:4px 0"><span>${h(s.userName)} <span class="small muted num">${fmtD(s.closedAt)}</span></span><b class="num ${s.diff<0?'neg':s.diff>0?'pos':''}">${s.diff===0?'مطابق':(s.diff>0?'+':'−')+f0(Math.abs(s.diff))}</b></div>`).join('')||(open.length?'':'<p class="muted">لا توجد ورديات</p>')}</div>
  <div class="card"><h2>تنبيهات المخزن</h2>${lowList().map(p=>`<div class="row" style="justify-content:space-between;padding:3px 0"><span>${h(p.name)}</span><span class="chip off num">${qf(p.stock)}</span></div>`).join('')||'<p class="muted">لا نواقص</p>'}</div></div>`;
}

  <button class="btn" style="margin-top:12px" onclick="saveSet()">حفظ الإعدادات</button></div>
  <div class="card"><h2>المزامنة بين الأجهزة</h2><p class="small muted">الحالة: <span id="netchip" class="chip"></span></p><p class="small muted">${cfg.url?'هذا الجهاز مربوط بقاعدة البيانات المشتركة.':'هذا الجهاز يعمل محلياً فقط. اربطه بقاعدة بيانات مشتركة لتتوحد المبيعات والمخزن بين الكاشيرات الثلاثة.'}</p><button class="btn" onclick="syncModal()">إعدادات الربط</button>
  <h2 style="margin-top:18px">النسخ الاحتياطي</h2><div class="row"><button class="btn" onclick="exportDB()">تصدير نسخة</button><label class="btn sec" style="cursor:pointer">استيراد نسخة<input type="file" accept=".json,application/json" hidden onchange="importDB(this)"></label></div>
  <h2 style="margin-top:18px">إعادة الضبط</h2><button class="btn bad" onclick="resetAsk()">مسح كل البيانات</button></div></div>`;
  updChrome();
}
function saveSet(){const g=k=>$('#s_'+k).value.trim();upd('settings',{store:g('store')||'كاشير',vat:Math.max(0,+g('vat')||0),cur:g('cur')||'د.ع',owner:g('owner'),footer:g('footer'),expDays:Math.max(1,+g('exp')||30),allowNeg:$('#s_neg').checked});toast('تم الحفظ');render()}
function syncModal(){
  modal(`<h2>الربط بقاعدة البيانات المشتركة</h2>
  <p class="small muted">يعمل الربط عبر Firebase Realtime Database (مجاني). الصق رابط القاعدة ثم المفتاح السري. أي شخص يعرف الرابط والمفتاح معاً يستطيع الوصول لبياناتك، فاحفظ المفتاح لنفسك فقط.</p>
  <div class="form"><label class="full">رابط قاعدة البيانات<input id="y_url" class="num" placeholder="https://اسم-مشروعك-default-rtdb.firebaseio.com" value="${h(cfg.url)}"></label>
  <label class="full">مفتاح المحل السري (20 حرفاً أو أكثر، إنجليزي وأرقام). استخدم نفس المفتاح في كل الأجهزة<span class="row" style="flex-wrap:nowrap"><input id="y_auth" class="num" value="${h(cfg.auth)}" autocomplete="off"><button class="btn sec sm" type="button" onclick="genKey()">توليد</button></span></label></div>
  <div class="row" style="margin-top:12px"><button class="btn" onclick="saveSync()">حفظ واتصال</button><button class="btn sec" onclick="closeModal()">إلغاء</button><span class="grow"></span>${cfg.url?`<button class="btn bad sm" onclick="unsync()">فصل الجهاز (عمل محلي)</button>`:''}</div>`);
}
function genKey(){const c='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789',a=new Uint32Array(28);(window.crypto||{getRandomValues:x=>x.map(()=>Math.random()*4294967296)}).getRandomValues(a);$('#y_auth').value=Array.from(a,x=>c[x%c.length]).join('')}
function saveSync(){
  let u=$('#y_url').value.trim();if(!/^https:\/\/[^\s\/]+\/?$/.test(u))return toast('أدخل رابط القاعدة فقط، يبدأ بـ https:// وبدون أي مسار بعده');
  const k=$('#y_auth').value.trim();if(!/^[A-Za-z0-9_-]{20,}$/.test(k))return toast('المفتاح 20 حرفاً على الأقل: إنجليزي وأرقام فقط. اضغط توليد');
  cfg={url:u.replace(/\/+$/,''),auth:k};lsSet('cfg',cfg);closeModal();
  net='offline';gotSnap=false;recompute();connect();toast('جارٍ الاتصال...');if(U)render();else login();
}
function unsync(){disconnect();cfg={url:'',auth:''};lsSet('cfg',cfg);SRV=DB;pend=[];lsSet('out',pend);lsSet('data',SRV);net='local';closeModal();toast('الجهاز يعمل محلياً الآن');if(U)render();else login()}
function exportDB(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));a.download='kashier-backup-'+ymd(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();
}
function importDB(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.users||!d.settings)throw 0;W({t:'set',p:'',v:d});U=null;pickUser=null;toast('تم الاستيراد');login()}catch(e){toast('الملف غير صالح')}};r.readAsText(f)}
function resetAsk(){modal(`<h2>مسح كل البيانات؟</h2><p>ستُحذف المنتجات والفواتير والورديات والموظفون${cfg.url?' <b>من قاعدة البيانات المشتركة لكل الأجهزة</b>':''}. لا يمكن التراجع. يُنصح بتصدير نسخة قبل ذلك.</p><div class="row"><button class="btn bad" onclick="W({t:'set',p:'',v:seedTree()});U=null;pickUser=null;closeModal();login()">نعم، امسح</button><button class="btn sec" onclick="closeModal()">رجوع</button></div>`)}

/* ======================= مسح الباركود بالكاميرا ======================= */
let camStream=null,camTimer=null,camLast='',camLastT=0;
function stopCam(){clearTimeout(camTimer);camTimer=null;if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}const o=$('#scov');if(o)o.remove()}
function loadZX(){return new Promise((ok,no)=>{if(window.ZXing)return ok();const x=document.createElement('script');x.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';x.onload=ok;x.onerror=no;document.head.appendChild(x)})}
async function scanCam(mode){
  stopCam();
  const o=document.createElement('div');o.className='ov';o.id='scov';o.style.zIndex=70;
  o.innerHTML=`<div class="modal"><h2>مسح الباركود</h2><video id="cam" playsinline muted style="width:100%;border-radius:10px;background:#000;max-height:60vh"></video>
  <p id="camMsg" class="small muted">جارٍ تشغيل الكاميرا...</p><div class="row"><button class="btn sec" onclick="stopCam()">إغلاق</button></div></div>`;
  document.body.appendChild(o);
  const msg=t=>{const m=$('#camMsg');if(m)m.textContent=t};
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return msg('المتصفح لا يدعم الكاميرا هنا. افتح الصفحة في Safari أو Chrome عبر رابط https.');
  try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}
  catch(e){return msg('تعذّر تشغيل الكاميرا. اسمح بالوصول للكاميرا من إعدادات المتصفح.')}
  const v=$('#cam');if(!v){stopCam();return}
  v.srcObject=camStream;try{await v.play()}catch(e){}
  let read;
  if('BarcodeDetector' in window){
    try{const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code']});
      read=async()=>{const r=await det.detect(v);return r.length?r[0].rawValue:null}}catch(e){}
  }
  if(!read){
    msg('جارٍ تحميل قارئ الباركود (يحتاج إنترنت أول مرة)...');
    try{await loadZX()}catch(e){return msg('تعذّر تحميل قارئ الباركود. تحقق من الإنترنت أو استخدم جهاز Scanner.')}
    const c=document.createElement('canvas'),rd=new ZXing.MultiFormatReader(),hints=new Map();
    hints.set(ZXing.DecodeHintType.TRY_HARDER,true);rd.setHints(hints);
    read=async()=>{if(!v.videoWidth)return null;c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
      try{return rd.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c)))).getText()}catch(e){return null}}
  }
  msg('وجّه الكاميرا نحو الباركود');
  const loop=async()=>{
    if(!camStream)return;
    try{const code=await read();
      if(code&&(code!==camLast||Date.now()-camLastT>2500)){camLast=code;camLastT=Date.now();
        const p=list('products').find(x=>x.barcode===code);
        if(mode==='prod'){
          const f=$('#f_bc');if(f)f.value=code;stopCam();
          const cur=window.__editingProd;
          toast(p&&p.id!==cur?'تنبيه: هذا الباركود مسجّل للمادة «'+p.name+'»':'تم مسح الباركود: '+code);return}
        if(p){add(p.id);msg('أُضيفت: '+p.name+' — يمكنك مسح مادة أخرى')}else msg('باركود غير مسجّل: '+code)}}catch(e){}
    camTimer=setTimeout(loop,250);
  };
  loop();
}

/* ======================= التشغيل ======================= */
window.addEventListener('online',()=>{if(cfg.url){connect();flush()}});
window.addEventListener('offline',()=>{if(cfg.url)setNet('offline')});
(function boot(){
  if(!cfg.url){if(!SRV.users)SRV=seedTree();DB=SRV;lsSet('data',SRV)}else{recompute();connect()}
  login();
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script></body></html>
